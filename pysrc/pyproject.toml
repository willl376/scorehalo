[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorehalo"
version = "0.1.0"
description = "Photo/graphics-tolerant OMR front-end: PDF/image -> MusicXML for MuseScore"
requires-python = ">=3.12"
dependencies = [
    "homr>=0.7",
    "pypdfium2>=5.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10",
]

# Without this, `pip install` produces no `scorehalo` command and the README's
# documented invocations (`scorehalo convert ...`) do not exist. The launcher
# in ~/.local/bin was a hand-written wrapper hiding this.
[project.scripts]
scorehalo = "scorehalo.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["scorehalo"]