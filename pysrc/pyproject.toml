[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scorehalo"
version = "0.1.0"
description = "Photo/graphics-tolerant OMR front-end: PDF/image -> MusicXML for MuseScore"
requires-python = ">=3.12"
dependencies = [
    "homr>=0.7",
    "pypdfium2>=5.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["scorehalo"]